<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=860"><meta name="robots" content="noindex,nofollow"><title>히어로투어 카페 대문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Playfair+Display:ital,wght@0,700;1,500&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff}
.gate{position:relative;width:860px;height:890px;overflow:hidden;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#2B2620}
.gate>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gate::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,28,44,.30) 0%,rgba(20,28,44,.08) 30%,rgba(250,244,234,0) 45%,rgba(30,26,22,.10) 100%)}
.top{position:relative;text-align:center;padding-top:52px;color:#fff;text-shadow:0 2px 14px rgba(15,22,40,.45)}
.top .logo{height:34px;opacity:.95}
.top .kick{margin-top:14px;font-family:"Noto Serif KR",serif;font-size:24px;font-weight:500;letter-spacing:.02em}
.top h1{margin-top:6px;font-family:"Noto Serif KR",serif;font-size:64px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.top .line{width:56px;height:1.5px;background:rgba(255,255,255,.8);margin:16px auto 0}
.grid{position:absolute;left:44px;right:44px;top:300px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:rgba(251,248,242,.95);border:1px solid rgba(43,38,32,.10);border-radius:4px;padding:20px 22px 20px 20px;display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center;box-shadow:0 8px 26px rgba(20,24,36,.16)}
.card.c5{grid-column:1/3;width:calc(50% - 7px);justify-self:center}
.ic{width:64px;height:64px;border-radius:50%;background:#F1E7D8;display:flex;align-items:center;justify-content:center}
.ic svg{width:32px;height:32px;stroke:#B5552B;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.no{font-family:"Playfair Display",serif;font-style:italic;font-size:15px;color:#9A8F80;letter-spacing:.04em}
.card b{display:block;margin-top:2px;font-family:"Noto Serif KR",serif;font-size:25px;font-weight:700;letter-spacing:-.03em;color:#2B2620}
.card b em{font-style:normal;color:#B5552B}
.card p{margin-top:6px;font-size:16.5px;line-height:1.45;color:#5E554A;letter-spacing:-.01em}
</style></head><body style="margin:0 auto">
<section class="gate">
<img class="bg" src="img/gate_bg_soft_s.jpg" alt="">
<div class="top"><img class="logo" src="img/logo_white.png" alt="HERO"><div class="kick">다낭 여행의 시작과 끝</div><h1>다낭 히어로 투어</h1><div class="line"></div></div>
<div class="grid">
 <div class="card"><div class="ic"><svg viewBox="0 0 32 32"><circle cx="11" cy="10" r="4"/><circle cx="22" cy="11" r="3.2"/><path d="M3.5 26c0-4.6 3.4-8 7.5-8s7.5 3.4 7.5 8"/><path d="M17 20.5c1.2-1.3 3-2.1 5-2.1 3.6 0 6.5 2.9 6.5 7.6"/></svg></div>
  <div><span class="no">Benefit 01</span><b><em>프라이빗</em> 단독투어</b><p>프라이빗한 단독차량 &amp;<br>단독가이드</p></div></div>
 <div class="card"><div class="ic"><svg viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="20" rx="2"/><path d="M5 13h22M11 4v6M21 4v6"/><path d="M11.5 20l3 3 6-6"/></svg></div>
  <div><span class="no">Benefit 02</span><b>투어 <em>일정조율</em></b><p>단독투어라서 투어일정도<br>조율 가능합니다</p></div></div>
 <div class="card"><div class="ic"><svg viewBox="0 0 32 32"><path d="M7 10h18l-2 14H9z"/><path d="M12 10V8a4 4 0 0 1 8 0v2"/><path d="M5 27L27 5"/></svg></div>
  <div><span class="no">Benefit 03</span><b><em>NO</em>쇼핑 <em>NO</em>옵션</b><p>쇼핑 옵션 없는<br>편안한 여행</p></div></div>
 <div class="card"><div class="ic"><svg viewBox="0 0 32 32"><path d="M16 4l10 4v7c0 6.5-4.3 11-10 13C10.3 26 6 21.5 6 15V8z"/><path d="M11.5 16l3 3 6-6"/></svg></div>
  <div><span class="no">Benefit 04</span><b><em>여행자 보험</em> 무료가입</b><p>여행기간동안<br>여행자 보험 무료가입</p></div></div>
 <div class="card c5"><div class="ic"><svg viewBox="0 0 32 32"><path d="M5 19l2-6.5A3 3 0 0 1 9.9 10.4h12.2a3 3 0 0 1 2.9 2.1L27 19v5H5z"/><path d="M5 19h22"/><circle cx="10" cy="24" r="2.2"/><circle cx="22" cy="24" r="2.2"/></svg></div>
  <div><span class="no">Benefit 05</span><b>공항 <em>무료픽업</em></b><p>편안한 여행 되실 수 있도록<br>무료 픽업 서비스</p></div></div>
</div>
</section></body></html>
